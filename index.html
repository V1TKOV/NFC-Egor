<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram: Join @channel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f141f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .avatar {
            width: 96px;
            height: 96px;
            background-color: #2b5278;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
            color: #fff;
        }
        h1 {
            font-size: 22px;
            margin: 10px 0 5px 0;
        }
        p {
            color: #707579;
            font-size: 14px;
            margin: 0 0 30px 0;
        }
        .btn {
            background-color: #2481cc;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            outline: none;
        }
        .btn:active {
            background-color: #1b6ca8;
        }
    </style>
</head>
<body>

    <!-- Можешь поменять эмодзи и текст на что-то более правдоподобное -->
    <div class="avatar">📢</div>
    <h1>Секретный Канал</h1>
    <p>Просмотр поста в Telegram</p>

    <!-- Кнопка только запускает скрипт воспроизведения -->
    <button class="btn" onclick="playSound()">Войти в канал</button>

    <!-- Твой аудиофайл (должен лежать рядом с файлом index.html) -->
    <audio id="audioPlayer" src="sound.mp3"></audio>

    <script>
        function playSound() {
            const audio = document.getElementById('audioPlayer');
            // Сбрасываем на начало на случай, если кто-то нажмет кнопку дважды
            audio.currentTime = 0; 
            audio.play().catch(error => {
                console.log("Звук не запустился:", error);
            });
        }
    </script>

</body>
</html>
