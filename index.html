<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram: Join @channel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f141f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .avatar {
            width: 96px;
            height: 96px;
            background-color: #2b5278;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
            color: #fff;
        }
        h1 {
            font-size: 22px;
            margin: 10px 0 5px 0;
        }
        p {
            color: #707579;
            font-size: 14px;
            margin: 0 0 30px 0;
        }
        .btn {
            background-color: #2481cc;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:active {
            background-color: #1b6ca8;
        }
    </style>
</head>
<body>

    <div class="avatar">📢</div>
    <h1>Название Канала</h1>
    <p>Просмотр поста в Telegram</p>

    <!-- Кнопка выполняет два действия: запускает звук и перенаправляет в Telegram -->
    <a href="https://t.me/toplesofficial" class="btn" onclick="playSound(event)">Войти в канал</a>

    <audio id="audioPlayer" src="sound.mp3"></audio>

    <script>
        function playSound(event) {
            // Предотвращаем мгновенный переход на доля секунды, чтобы аудио успело стартовать
            event.preventDefault();
            
            const audio = document.getElementById('audioPlayer');
            const targetUrl = event.currentTarget.href;

            audio.play().then(() => {
                // Небольшая задержка перед переходом, чтобы звук точно начал воспроизводиться
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 300); // 300 миллисекунд
            }).catch(error => {
                // Если браузер все же заблокировал, сразу кидаем в телегу без звука
                window.location.href = targetUrl;
            });
        }
    </script>

</body>
</html>
